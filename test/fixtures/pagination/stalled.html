<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paginated list — stuck page</title>
    <style>
      body { font-family: sans-serif; }
      .item { padding: 4px 0; border-bottom: 1px solid #ddd; }
      nav { margin-top: 16px; }
      a, button { margin-right: 8px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Paginated items that never advance</h1>
    <ul id="items">
      <li class="item">Stuck — Item A</li>
      <li class="item">Stuck — Item B</li>
    </ul>
    <nav>
      <!-- Visible and clickable, but the click does nothing: no navigation, no DOM change. -->
      <button id="next" type="button">Next page</button>
      <!-- A second next button hidden from the start, used by the noNext (invisible) test. -->
      <button id="next-hidden" class="hidden" type="button">Next page (hidden)</button>
    </nav>
  </body>
</html>
