<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark mode</title>
<meta name="theme-color" content="#c9c4bb">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c3bdb3; }
  body { -webkit-font-smoothing: antialiased; }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    opacity: 0; transition: opacity 1100ms cubic-bezier(.2, .7, .2, 1);
  }
  canvas.ready { opacity: 1; }
  #switch {
    position: fixed; left: 0; top: 0; width: 1px; height: 1px;
    margin: 0; padding: 0; border: 0; background: transparent; border-radius: 999px;
    cursor: pointer; touch-action: none; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  #switch.dragging { cursor: grabbing; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(26px, 5.5vh);
    text-align: center; pointer-events: none; user-select: none;
    font: 500 10.5px/1 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    letter-spacing: .26em; text-transform: uppercase; color: rgba(52, 46, 38, .40);
    transition: opacity 900ms ease, transform 900ms cubic-bezier(.2, .7, .2, 1);
  }
  .hint.gone { opacity: 0; transform: translateY(6px); }
  .fallback {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 500 14px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif; color: #4a443b;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="switch" role="switch" aria-checked="false" aria-label="Dark mode"></button>
<div class="hint" id="hint">Click, drag or press space</div>
<script>
(() => {
'use strict';

const DEBUG = new URLSearchParams(location.search).has('debug');
const LOCK_RES = DEBUG || new URLSearchParams(location.search).has('hq');  // ?hq: full resolution, never adapts (for recording)
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

// ─── world constants (shared with the shader) ───────────────────────────────
const L = 0.95;      // half length of the groove's straight part
const R = 0.50;      // groove radius
const D = 0.17;      // groove depth
const FOCAL = 3.0;
const DIST = 7.6;
const ELEV = 32 * Math.PI / 180;
const TA = [0, 0.16, -0.02];

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ─── shaders ────────────────────────────────────────────────────────────────
const VS = `#version 300 es
const vec2 P[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
void main() { gl_Position = vec4(P[gl_VertexID], 0.0, 1.0); }`;

const POST = `
vec3 tonemapNeutral(vec3 c) {
  const float start = 0.76;
  const float desat = 0.07;
  float x = min(c.r, min(c.g, c.b));
  float off = x < 0.08 ? x - 6.25 * x * x : 0.04;
  c -= off;
  float peak = max(c.r, max(c.g, c.b));
  if (peak < start) return c;
  const float d = 1.0 - start;
  float np = 1.0 - d * d / (peak + d - start);
  c *= np / peak;
  float g = 1.0 - 1.0 / (desat * (peak - np) + 1.0);
  return mix(c, vec3(np), g);
}
vec3 toSRGB(vec3 c) {
  c = max(c, 0.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}
float grainHash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 finish(vec3 c, vec2 fc, vec2 res, float time, float expo, float vig) {
  vec2 q = fc / res - 0.5; q.x *= res.x / res.y;
  c *= 1.0 - vig * smoothstep(0.2, 1.15, length(q));
  c = toSRGB(tonemapNeutral(c * expo));
  c += (grainHash(fc + fract(time * 7.13) * 917.0) - 0.5) * 0.014;
  return c;
}`;

const SCENE = (direct) => `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uScale, uFocal, uTime, uOn, uFocus, uLabel, uExpo;
uniform vec3 uRo, uTa;
uniform vec4 uChain[3];   // tail, body, head: x, z, radius
uniform float uSquash;    // height / width of the liquid
uniform vec4 uDrop[3];    // two droplets + the cursor reach: x, z, rxz, ry
uniform vec2 uFlow;       // ripple amount, ripple phase
uniform float uDropK[3];
uniform vec4 uRing;
uniform vec2 uCrown, uLean;
uniform vec4 uFBox;       // liquid bounds: min x, max x, top, half depth
uniform vec3 uGlow, uGlowCol, uHotCol;
uniform vec4 uSplash[8];  // flying droplets: x, y, z, radius
uniform vec3 uInk;        // black film: front radius, amount, centre x
uniform vec2 uRipple;     // shock ring on the film: radius, strength
uniform sampler2D uLabelTex;
${direct ? POST : ''}

#define L 0.95
#define R 0.50
#define D 0.17
#define RB 0.10

const vec3 BMIN = vec3(-L - R - 0.36, -D - 0.03, -R - 0.42);
const vec3 BMAX = vec3( L + R + 0.36, 1.25, R + 0.62);
const vec3 KEYDIR = normalize(vec3(-0.42, 1.0, -0.40));
const vec3 KEYCOL = vec3(1.0, 0.955, 0.895) * 1.25;
const vec2 LBL_O = vec2(-L, R + 0.30);
const vec2 LBL_I = vec2( L, R + 0.30);

// crown of spikes: centre + three rings
const float RR[4]  = float[4](0.0, 0.155, 0.275, 0.372);
const float RN[4]  = float[4](1.0, 6.0, 12.0, 17.0);
const float RH[4]  = float[4](0.66, 0.50, 0.335, 0.19);
const float SB[4]  = float[4](0.13, 0.105, 0.08, 0.062);
const float RL[4]  = float[4](0.0, 0.15, 0.33, 0.56);
const float RO[4]  = float[4](0.0, 0.0, 0.26, 0.11);
const vec2 HS[4]   = vec2[4](vec2(0.0, 1.0), vec2(0.5, 0.8660254), vec2(0.2588190, 0.9659258), vec2(0.1837495, 0.9829731));  // sin, cos of pi / RN

float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float hash11(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}

vec2 boxHit(vec3 ro, vec3 rd) {
  vec3 inv = 1.0 / rd;
  vec3 t0 = (BMIN - ro) * inv, t1 = (BMAX - ro) * inv;
  vec3 a = min(t0, t1), b = max(t0, t1);
  return vec2(max(max(a.x, a.y), a.z), min(min(b.x, b.y), b.z));
}

// ─── solid: surface with a pill groove and two engraved marks ──────────────
float sdTrack(vec2 p) { return length(vec2(max(abs(p.x) - L, 0.0), p.y)) - R; }
float sdGroove(vec3 p) {
  vec2 w = vec2(sdTrack(p.xz), -(p.y + D)) + RB;
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - RB;
}
float sdMarkO(vec2 q) { return abs(length(q - LBL_O) - 0.072) - 0.0135; }
float sdMarkI(vec2 q) { vec2 d = q - LBL_I; return length(vec2(d.x, max(abs(d.y) - 0.064, 0.0))) - 0.0135; }
float mapSolid(vec3 p) {
  float s = smax(p.y, -sdGroove(p), 0.035);
  float m = min(sdMarkO(p.xz), sdMarkI(p.xz));
  if (m < 0.06) s = smax(s, -max(m, -(p.y + 0.014)), 0.005);
  return s;
}

// ─── fluid ──────────────────────────────────────────────────────────────────
float sdEll(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-5);
}
float fluidBound(vec3 p) {
  vec3 lo = vec3(uFBox.x, -D - 0.06, -uFBox.w);
  vec3 hi = vec3(uFBox.y, uFBox.z, uFBox.w);
  vec3 q = abs(p - 0.5 * (lo + hi)) - 0.5 * (hi - lo);
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}
// kn: Lipschitz scale shared by a whole ring, so neighbouring sectors agree at their border
float sdSpike(vec3 q, float h, float r0, vec2 lean, float kn) {
  q.xz -= lean * clamp(q.y, 0.0, h);
  float t = clamp(q.y / h, 0.0, 1.0);
  float r = r0 * pow(1.0 - t, 1.55) + 0.0022;
  float d = (length(q.xz) - r) * kn;
  d = max(d, -q.y - 0.06);
  // above the tip: distance to the tip point; a flat cap here lifts the blended surface into plateaus
  return q.y > h ? max(d, kn * (length(vec2(length(q.xz), q.y - h)) - 0.0022)) : d;
}
// 'far' > 0: occlusion query, where a bound must never stand in for geometry.
// 'cap': distance to the liquid body; a ring that provably stays farther than it can't change the surface
float crown(vec3 p, float far, float cap) {
  vec2 rel = p.xz - uCrown;
  float bnd = length(vec2(max(length(rel) - 0.74, 0.0), max(p.y - uFBox.z, 0.0)));
  if (far > 0.0) { if (bnd > far) return 1e5; }
  else if (bnd > 0.06) return bnd;  // must exceed the smin radius in mapFluid, or the bound kinks the surface
  float rx = uChain[1].z, ry = rx * uSquash;
  float yc = -D + ry * 0.2;
  float d = 1e5, ang = 10.0;  // 10: not computed yet
  bool leaning = dot(uLean, uLean) > 1e-6;
  float rho = length(rel), lean0 = length(uLean);
  for (int i = 0; i < 4; i++) {
    float hn = uRing[i];
    if (hn < 0.003) continue;
    float N = RN[i];
    float sector = 6.2831853 / N;
    // rings ride the dome: while the liquid is still stretched they sit closer in
    float rad = RR[i] * min(rx / 0.376, 1.0);
    float rr = rad / rx;
    float by = yc + ry * sqrt(max(1.0 - rr * rr, 0.0)) - 0.035;
    float r0 = SB[i] * mix(0.32, 1.0, clamp(hn * 1.4, 0.0, 1.0));
    float s = min(1.55 * r0 / (0.887 * RH[i] * hn + 0.035), 4.5);  // steepest the ring's var * br allows
    float la = RL[i] * clamp(hn, 0.0, 1.2) + lean0;
    float kn = inversesqrt(1.0 + s * s + la * la);
    // cull: the whole ring lives in an annulus; skip it when even its nearest point can't matter
    float hmax = RH[i] * hn * 1.12 + 0.035;
    float gap = max(abs(rho - rad) - (r0 + la * hmax + 0.045), max(p.y - by - hmax, by - 0.06 - p.y));
    if (kn * gap > min(d, cap) + 0.08) continue;
    // pick the sector in the same sheared frame the ring's spikes lean in
    vec2 rs = rel - uLean * clamp(p.y - by, 0.0, RH[i] * hn + 0.035);
    float id = 0.0;
    if (i > 0) {
      if (ang > 9.0 || leaning) ang = atan(rs.y, rs.x);  // without lean every ring shares one frame
      id = floor((ang - RO[i]) / sector + 0.5);
    }
    float a = id * sector + RO[i];
    vec2 dir = vec2(cos(a), sin(a));
    // hard edges in the spike field show as creases in the blended liquid: round the sector
    // fold always (seams in the settled skirt), and while spikes are low and buried also blend
    // the rings and make neighbours identical
    float low = 1.0 - smoothstep(0.3, 0.6, hn);
    vec3 ps = p;
    if (i > 0) {
      float u = dot(rs, dir), v = dir.x * rs.y - dir.y * rs.x;  // along / across this spike's axis
      vec2 hs = HS[i];
      float x = u * hs.x - abs(v) * hs.y;                         // distance inside from the border
      float e = min(0.035, max(u, 0.0) * hs.x);
      if (x < e && e > 1e-4) ps.xz += (x * x / (2.0 * e) + 0.5 * e - x) * (dir * hs.x - vec2(-dir.y, dir.x) * sign(v) * hs.y);
    }
    vec2 bp = uCrown + dir * rad;
    float seed = mod(id, N) + float(i) * 17.0;
    float var = 1.0 + 0.18 * (hash11(seed) - 0.5) * (1.0 - low);
    float br = 1.0 + 0.025 * sin(uTime * 2.2 + seed * 2.39) * (1.0 - low);
    float h = RH[i] * hn * var * br + 0.035;
    vec2 lean = dir * RL[i] * clamp(hn, 0.0, 1.2) + uLean;
    d = smin(d, sdSpike(ps - vec3(bp.x, by, bp.y), h, r0, lean, kn), max(0.07 * low, 1e-4));
  }
  return d;
}
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a;
  float l2 = dot(ba, ba);
  float rr = r1 - r2;
  if (l2 < 1e-6 || rr * rr >= l2) return min(length(p - a) - r1, length(p - b) - r2);
  float a2 = l2 - rr * rr;
  float il2 = 1.0 / l2;
  vec3 pa = p - a;
  float y = dot(pa, ba);
  float z = y - l2;
  vec3 w = pa * l2 - ba * y;
  float x2 = dot(w, w);
  float y2 = y * y * l2;
  float z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
float mapFluid(vec3 p, float far) {
  float yc = -D + 0.2 * uChain[1].z * uSquash;
  vec3 q = vec3(p.x, yc + (p.y - yc) / uSquash, p.z);
  vec3 a = vec3(uChain[0].x, yc, uChain[0].y);
  vec3 b = vec3(uChain[1].x, yc, uChain[1].y);
  vec3 c = vec3(uChain[2].x, yc, uChain[2].y);
  float d = smin(sdRoundCone(q, a, b, uChain[0].z, uChain[1].z), sdRoundCone(q, b, c, uChain[1].z, uChain[2].z), 0.14);
  d *= min(uSquash, 1.0);
  d -= uFlow.x * 0.0038 * (0.6 * sin(p.x * 17.0 - uFlow.y + p.z * 5.0) + 0.4 * sin(p.x * 29.0 - uFlow.y * 1.7 - p.z * 8.0));
  for (int i = 0; i < 3; i++) {
    vec4 e = uDrop[i];
    if (e.z < 0.003) continue;
    d = smin(d, sdEll(p - vec3(e.x, -D + e.w * 0.2, e.y), vec3(e.z, e.w, e.z)), uDropK[i]);
  }
  for (int i = 0; i < 8; i++) {
    vec4 e = uSplash[i];
    if (e.w < 0.004) continue;
    d = smin(d, length(p - e.xyz) - e.w, 0.04);
  }
  if (uRing.x + uRing.y + uRing.z + uRing.w > 0.004) d = smin(d, crown(p, far, d), 0.055);
  return d;
}
vec2 map(vec3 p) {
  float s = mapSolid(p);
  float fb = fluidBound(p);
  float f = fb > 0.06 ? fb : mapFluid(p, 0.0);
  return f < s ? vec2(f, 1.0) : vec2(s, 0.0);
}
float mapD(vec3 p) { return map(p).x; }
// for shadows and occlusion the bounding box must never count as geometry:
// past 'far' the fluid is too distant to matter, so it is left out entirely
float mapOcc(vec3 p, float far) {
  float s = mapSolid(p);
  float fb = fluidBound(p);
  return fb > far ? s : min(s, mapFluid(p, far));
}

vec3 calcNormal(vec3 p) {
  const vec2 e = vec2(1.0, -1.0) * 0.0006;
  return normalize(e.xyy * mapD(p + e.xyy) + e.yyx * mapD(p + e.yyx) + e.yxy * mapD(p + e.yxy) + e.xxx * mapD(p + e.xxx));
}
float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 4; i++) {
    float h = 0.012 + 0.07 * float(i);
    occ += (h - mapOcc(p + h * n, 0.26)) * sca;
    sca *= 0.82;
  }
  return clamp(1.0 - 2.4 * occ, 0.0, 1.0);
}
float softShadow(vec3 ro, vec3 rd) {
  vec2 tb = boxHit(ro, rd);
  if (tb.y <= 0.0 || tb.x > tb.y) return 1.0;
  // jittered start turns penumbra banding into fine noise the grain hides
  float t = max(tb.x, 0.015) + 0.012 * hash12(gl_FragCoord.xy);
  float res = 1.0, ph = 1e10;
  for (int i = 0; i < 40; i++) {
    if (t > tb.y) break;
    float h = mapOcc(ro + rd * t, 0.2 + 0.11 * t);
    float y = h < ph ? h * h / (2.0 * ph) : 0.0;  // h may jump where far geometry is skipped
    float d = sqrt(max(h * h - y * y, 0.0));
    res = min(res, 9.0 * d / max(t - y, 1e-4));
    ph = h;
    if (res < 0.003) break;
    t += clamp(h * 0.85, 0.012, 0.2);
  }
  res = clamp(res, 0.0, 1.0);
  return res * res * (3.0 - 2.0 * res);
}

// ─── light ──────────────────────────────────────────────────────────────────
vec3 glowAt(float x) {
  x = clamp(x, -L - R * 0.6, L + R * 0.6);
  float e = uGlow.x;
  float fill = 1.0 - smoothstep(e - 0.32, e + 0.32, x);
  float fx = (x - e) / 0.22;
  float front = exp(-fx * fx) * uGlow.z;
  float shimmer = 1.0 + 0.05 * sin(uTime * 1.7 + x * 3.1) * sin(uTime * 0.9 - x * 1.3);
  return uGlow.y * (uGlowCol * fill * shimmer + uHotCol * front);
}
vec3 spill(vec3 p, vec3 n, float d2) {
  if (uGlow.y < 0.002) return vec3(0.0);
  vec2 c = vec2(clamp(p.x, -L, L), 0.0);
  vec2 v = p.xz - c;
  float lv = length(v);
  vec2 sxz = c + (lv > 1e-4 ? v / lv : vec2(0.0)) * min(lv, R - 0.14);
  vec3 l = vec3(sxz.x, -D + 0.01, sxz.y) - p;
  float dist = length(l);
  float lam = max(dot(n, l / max(dist, 1e-4)), 0.0);
  float fall = 1.0 / (1.0 + 26.0 * dist * dist);
  float top = step(-0.003, p.y) * 0.42 * exp(-max(d2, 0.0) * 4.2);
  return glowAt(p.x) * (lam * fall * 3.0 + top);
}
float panel(vec3 r, vec3 c, vec2 s, float soft) {
  float k = dot(r, c);
  if (k <= 0.0) return 0.0;
  vec3 u = normalize(vec3(c.z, 0.0, -c.x));
  vec3 v = cross(c, u);
  vec2 q = abs(vec2(dot(r, u), dot(r, v)) / k);
  vec2 e = 1.0 - smoothstep(s - soft, s + soft, q);
  vec2 f = q / s;
  return e.x * e.y * (1.0 - 0.32 * dot(f, f));
}
vec3 env(vec3 r) {
  float dim = 1.0 - 0.35 * uOn;
  vec3 col = mix(vec3(0.07, 0.068, 0.066), vec3(0.30, 0.305, 0.32), smoothstep(-0.15, 0.9, r.y)) * dim;
  col += vec3(1.0, 0.98, 0.96) * 16.0 * dim * panel(r, normalize(vec3(-0.75, 0.22, 0.65)), vec2(0.035, 0.42), 0.02);
  col += vec3(0.95, 0.97, 1.0) * 12.0 * dim * panel(r, normalize(vec3(0.8, 0.18, 0.6)), vec2(0.03, 0.42), 0.02);
  col += vec3(1.0, 0.97, 0.92) * 24.0 * dim * panel(r, KEYDIR, vec2(0.5, 0.28), 0.12);
  col += vec3(0.93, 0.96, 1.0) * 22.0 * dim * panel(r, normalize(vec3(1.0, 0.48, -0.12)), vec2(0.05, 0.62), 0.025);
  col += vec3(1.0, 0.98, 0.95) * 13.0 * dim * panel(r, normalize(vec3(-0.95, 0.30, -0.55)), vec2(0.045, 0.5), 0.02);
  col += vec3(1.0) * 1.3 * (1.0 - 0.85 * uInk.y) * panel(r, normalize(vec3(0.25, 0.42, 1.0)), vec2(0.9, 0.35), 0.35);
  col += uGlowCol * uGlow.y * 0.35 * (1.0 - smoothstep(-0.35, 0.25, r.y));
  // a long soft sweep behind the switch: only matters once the floor turns to wet black film
  col += vec3(1.0, 0.97, 0.94) * 6.0 * uInk.y * panel(r, normalize(vec3(0.0, 0.48, -1.0)), vec2(1.6, 0.13), 0.22);
  return col;
}

// ─── the black film that floods the surface when the magnet is on ───────────
float inkField(vec2 q) {  // < 0 inside the film
  float d = length(q - vec2(uInk.z, 0.0));
  vec2 w = vec2(vnoise(q * 0.8 + 3.1), vnoise(q * 0.8 - 7.3)) - 0.5;
  float n = vnoise(q * 1.7 + w * 2.4) * 0.65 + vnoise(q * 4.6 - w * 1.6) * 0.35;
  return d + (n - 0.5) * (0.3 + 0.38 * min(d, 3.0)) - uInk.x;
}
vec3 inkSurf(vec3 p, vec3 n, vec3 rd, float f) {
  if (abs(f) < 0.12) {  // meniscus: the film's edge bulges and catches light
    const vec2 e = vec2(0.01, 0.0);
    vec2 g = vec2(inkField(p.xz + e.xy) - inkField(p.xz - e.xy), inkField(p.xz + e.yx) - inkField(p.xz - e.yx)) / 0.02;

  o.start(t); o.stop(t + attack + dur + 0.05);
}
const rnd = (a, b) => a + Math.random() * (b - a);
const SFX = {
  // every flip: the magnet catches the liquid
  flip(on, x) {
    const t = Au.ctx.currentTime, pan = panOf(x);
    if (on) {  // a soft, rounded tap
      grain(t, 1900, 0.7, 0.008, 0.07, pan, 0.15);
      sub(t, 240, 190, 0.1, 0.13, 0.003, pan);
      return;
    }
    grain(t, 4200, 1.2, 0.012, 0.22, pan, 0.1);
    sub(t, 120, 70, 0.12, 0.3, 0.004, pan);
    bubble(t + 0.01, rnd(160, 200), 0.11, 0.17, pan, 0.25);
  },
  // the crown rises and the dark comes in: a clean, calm chord that blooms in the room
  erupt(_, x) {
    const t = Au.ctx.currentTime, pan = panOf(x) * 0.4;
    [[329.63, 0.07, 2.6], [493.88, 0.05, 2.2], [659.25, 0.042, 1.9], [987.77, 0.017, 1.4]].forEach(([f, a, d], i) => {
      [-1, 1].forEach((side) => {  // each note a gently detuned pair, spread left and right
        const o = Au.ctx.createOscillator(), v = voice(pan + side * 0.25, 0.7);
        o.frequency.value = f * (1 + side * 0.0012);
        o.connect(v);
        v.gain.setValueAtTime(0.0001, t + i * 0.035);
        v.gain.exponentialRampToValueAtTime(a, t + i * 0.035 + 0.06);
        v.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.035 + d);
        o.start(t + i * 0.035); o.stop(t + i * 0.035 + d + 0.05);
      });
    });
    sweep(t + 0.05, 'lowpass', 500, 140, 2.2, 0.035, 0.6, 0, 0.6);  // the dark settling in, barely there
    Au.humG.gain.setTargetAtTime(0.022, t + 0.4, 0.8);
  },
  // the spikes melt; the film is drawn back into the drop
  retract(_, x) {
    const t = Au.ctx.currentTime, pan = panOf(x);
    for (let i = 0; i < 16; i++) grain(t + rnd(0, 0.22), rnd(1400, 4200) * (1 - i * 0.03), rnd(5, 10), rnd(0.008, 0.02), rnd(0.015, 0.045), pan + rnd(-0.3, 0.3), 0.3);
    sweep(t, 'bandpass', 380, 2600, 0.42, 0.07, 0.3, pan, 0.4);  // reversed swell: the suck
    bubble(t + 0.36, 130, 0.22, 0.16, pan, 0.3);                  // the gulp as it lands home
    Au.humG.gain.setTargetAtTime(0.0001, t, 0.12);
  },
  plop(v, x) { bubble(Au.ctx.currentTime, rnd(140, 180), 0.16, Math.min(0.08 + v * 0.03, 0.22), panOf(x), 0.25); },
  plip(i, x) { bubble(Au.ctx.currentTime, rnd(620, 980) + i * 120, 0.06, 0.05, panOf(x), 0.35); },
  splash(s, x) {
    const t = Au.ctx.currentTime, pan = panOf(x);
    grain(t, 1800, 0.7, 0.06, 0.09 + 0.08 * s, pan, 0.3);
    bubble(t, rnd(220, 280), 0.09, 0.12, pan, 0.25);
    for (let i = 0; i < 3 + 4 * s; i++) bubble(t + rnd(0.005, 0.07), rnd(700, 1700), rnd(0.03, 0.06), rnd(0.03, 0.06), pan + rnd(-0.4, 0.4), 0.4);
  },
  tick(r, x) { bubble(Au.ctx.currentTime, 1400 + (0.066 - r) * 9000, 0.03, 0.035, panOf(x), 0.4); },
};
// continuous voices, driven by the simulation every frame
function flushAudio(dt) {
  if (!live()) { S.events.length = 0; return; }
  for (const [type, a, x] of S.events) SFX[type](a, x);
  S.events.length = 0;
  const c = Au.ctx, now = c.currentTime;
  const v = Math.abs(S.body.v) + 0.5 * Math.abs(S.head.v);
  Au.flowG.gain.setTargetAtTime(Math.min(v * 0.03, 0.12), now, 0.04);
  Au.flowF.frequency.setTargetAtTime(220 + v * 90, now, 0.05);
  Au.flowP.pan.setTargetAtTime(panOf(S.body.x), now, 0.05);
  // thick bubbling while it flows, more and smaller as it speeds up
  Au.bubbleDebt += Math.min(v, 9) * 7 * dt;
  while (Au.bubbleDebt > 1) {
    Au.bubbleDebt -= 1;
    const big = Math.random() < 0.35;
    bubble(now + rnd(0, 0.016), big ? rnd(110, 190) : rnd(240, 560 + v * 30), big ? rnd(0.08, 0.14) : rnd(0.025, 0.06),
      Math.min(0.025 + v * 0.008, 0.09) * (big ? 1.3 : 1), panOf(S.body.x + rnd(-0.4, 0.4)), 0.2);
  }
  // a hovering cursor stirs a faint magnetic crackle; the live crown keeps a few going
  const stir = S.hover.x * 22;
  Au.crackleDebt += stir * dt;
  while (Au.crackleDebt > 1) {
    Au.crackleDebt -= 1;
    grain(now + rnd(0, 0.016), rnd(3000, 8500), rnd(8, 14), rnd(0.004, 0.012), rnd(0.008, 0.022) * (0.4 + S.hover.x), panOf(S.body.x + rnd(-0.3, 0.3)), 0.35);
  }
}
function setMuted(m) {
  Au.muted = m;
  if (Au.ctx) Au.out.gain.setTargetAtTime(m ? 0 : 0.85, Au.ctx.currentTime, 0.02);
}

// ─── input ──────────────────────────────────────────────────────────────────
function setOn(on) {
  hint.classList.add('gone');
  if (S.on === on) return;
  S.on = on;
  btn.setAttribute('aria-checked', String(on));
  const dir = on ? 1 : -1, carried = -S.body.v * dir;  // momentum still flying the other way
  S.events.push(['flip', on, S.head.x]);
  if (!S.drag && carried > 3 && !reduceMotion.matches) splash(-dir, carried);
  if (!S.drag) { S.head.v += on ? 4.2 : -4.2; S.wob.v -= 2.2; }
}
const rubber = (x) => {
  const ex = Math.abs(x) - L;
  return ex > 0 ? Math.sign(x) * (L + ex / (1 + ex * 6)) : x;
};
btn.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || S.press) return;
  audioInit();
  btn.setPointerCapture(e.pointerId);
  const g = toGround(e.clientX, e.clientY);
  S.press = { id: e.pointerId, sx: e.clientX, sy: e.clientY, off: S.mag.x - g[0], dragging: false, lx: g[0], lt: e.timeStamp, vel: 0 };
  e.preventDefault();
});
btn.addEventListener('pointermove', (e) => {
  const p = S.press;
  if (!p || p.id !== e.pointerId) return;
  const g = toGround(e.clientX, e.clientY);
  if (!p.dragging && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 5) {
    p.dragging = true;
    btn.classList.add('dragging');
  }
  if (!p.dragging) return;
  S.drag = { x: rubber(g[0] + p.off) };
  const dt = (e.timeStamp - p.lt) / 1000;
  if (dt > 0) { p.vel += ((g[0] - p.lx) / dt - p.vel) * 0.5; p.lx = g[0]; p.lt = e.timeStamp; }
});
function release(e, cancelled) {
  const p = S.press;
  if (!p || p.id !== e.pointerId) return;
  S.press = null;
  btn.classList.remove('dragging');
  if (p.dragging) {
    const stale = e.timeStamp - p.lt > 90;
    let on = S.drag.x > 0;
    if (!stale && Math.abs(p.vel) > 2.2) on = p.vel > 0;
    S.drag = null;
    setOn(on);
    hint.classList.add('gone');
  } else if (!cancelled) {
    setOn(!S.on);
  }
}
btn.addEventListener('pointerup', (e) => release(e, false));
btn.addEventListener('pointercancel', (e) => release(e, true));

let lastKeyToggle = -1e9;
function keyToggle(e) {
  if (e.repeat) { e.preventDefault(); return; }
  e.preventDefault();
  audioInit();
  lastKeyToggle = e.timeStamp;
  setOn(!S.on);
}
btn.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') keyToggle(e);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); audioInit(); setOn(true); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); audioInit(); setOn(false); }
});
btn.addEventListener('keyup', (e) => { if (e.key === ' ') e.preventDefault(); });
// assistive tech activation arrives as a click with no pointer
btn.addEventListener('click', (e) => {
  if (e.detail === 0 && e.timeStamp - lastKeyToggle > 600) { audioInit(); setOn(!S.on); }
});
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'm' || e.key === 'M') { if (!e.repeat) { audioInit(); setMuted(!Au.muted); } return; }
  if (e.target === btn) return;
  const idle = !document.activeElement || document.activeElement === document.body;
  if (idle && (e.key === ' ' || e.key === 'Enter')) keyToggle(e);
});
addEventListener('pointermove', (e) => {
  S.cursor.sx = e.clientX; S.cursor.sy = e.clientY; S.cursor.inside = true;
});
document.documentElement.addEventListener('pointerleave', () => { S.cursor.inside = false; });
addEventListener('blur', () => { S.cursor.inside = false; });
// wall-clock time spent hidden (or in an un-rendered gap) that never advances the simulation.
// Settled either here or by the frame loop's safety net, never both: the first path to see
// the interval clears hiddenAt.
let hiddenAt = 0, bgDiscarded = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = performance.now();
    if (Au.ctx) { Au.flowG.gain.setValueAtTime(0, Au.ctx.currentTime); Au.humG.gain.setValueAtTime(0, Au.ctx.currentTime); }
  } else {
    if (hiddenAt) {
      bgDiscarded += (performance.now() - hiddenAt) / 1000;
      hiddenAt = 0;
    }
    // the next rAF must look like an ordinary frame: the hidden interval is dropped entirely,
    // so the simulation resumes exactly where it left off instead of leaping forward
    last = performance.now();
    if (Au.ctx && S.erupted && S.on) Au.humG.gain.setTargetAtTime(0.022, Au.ctx.currentTime, 0.4);
  }
});

// ─── loop ───────────────────────────────────────────────────────────────────
let paused = false, last = performance.now(), ema = 16, frames = 0, sinceAdapt = 0, shown = false;
let vsync = 16.7, slowFrames = 0, fastFrames = 0, adapt = 'none';

const FRAME_CAP = 1 / 20;        // a single frame may advance the sim by at most this
const BG_GAP_MS = 250;           // rAF gaps longer than this were spent not rendering
const QUALITY_MIN = 0.7, QUALITY_MAX = 1;
const DROP_HOLD = 90, RAISE_HOLD = 240, ADAPT_COOLDOWN = 180;  // frames

// move one quality step, but only if it actually changes the drawing size (the 3 Mpx cap can
// make a nominal step a no-op); the swap itself waits for the next frame's resize()
function stepQuality(up) {
  const q = clamp(+(up ? quality / 0.9 : quality * 0.9).toFixed(3), QUALITY_MIN, QUALITY_MAX);
  if (q === quality) return false;
  const d = dimsFor(q);
  if (d.w === W && d.h === H) return false;
  quality = q;
  resizePending = true;
  adapt = up ? 'up' : 'down';
  sinceAdapt = 0; slowFrames = 0; fastFrames = 0;
  return true;
}

function frame(now) {
  requestAnimationFrame(frame);
  let raw = now - last;
  // Safety net for any hidden interval visibilitychange missed: settle the whole gap against
  // hiddenAt, otherwise treat the oversized interval as an un-rendered (background) period.
  if (raw > BG_GAP_MS && !paused) {
    if (hiddenAt) {
      bgDiscarded += Math.min(raw, now - hiddenAt) / 1000;
      hiddenAt = 0;
    } else {
      bgDiscarded += (raw - BG_GAP_MS) / 1000;
    }
    raw = BG_GAP_MS;  // resume gently instead of feeding the whole gap into the sim
  }
  // One frame can advance at most FRAME_CAP. The remainder above the cap is deliberately
  // dropped here — it is never carried into the next frame, so a truncated frame cannot cause
  // a second jump on the frame that follows.
  const dt = Math.min(raw / 1000, FRAME_CAP);
  last = now;
  if (resizePending) { resizePending = false; resize(); }  // before drawing, so no cleared frame is ever shown
  if (!paused) {
    const g = toGround(S.cursor.sx, S.cursor.sy);
    S.cursor.x = g[0]; S.cursor.z = g[1];
    S.focusVisible = btn.matches(':focus-visible');
    advance(dt);
  }
  render();
  flushAudio(dt);
  if (!shown) { shown = true; canvas.classList.add('ready'); }
  // Adaptation is judged only while the tab is in front, so background throttling never counts.
  if (document.visibilityState === 'visible' && document.hasFocus() && raw < BG_GAP_MS) {
    frames++; sinceAdapt++;
    ema += (raw - ema) * 0.05;
    // the display's refresh is the *fastest* interval we ever see: only a shorter observation
    // may lower it. Letting slow frames raise it would drift the baseline toward the slow frame
    // time itself and eventually read chronic load as "fast" (the hysteresis would then hunt
    // upward under steady load). Initial 16.7 covers displays up to 60 Hz; 120/144 Hz pulls it
    // down on the very first frames.
    vsync = Math.min(vsync, raw);
  }
  // Hysteresis: the "too slow" and "fast enough" bands never overlap, which keeps the quality
  // from hunting when the frame time sits near the refresh rate.
  slowFrames = ema > vsync * 1.3 ? slowFrames + 1 : 0;
  fastFrames = ema < vsync * 1.05 ? fastFrames + 1 : 0;
  if (LOCK_RES || frames <= 120 || sinceAdapt <= ADAPT_COOLDOWN) return;
  if (slowFrames > DROP_HOLD && quality > QUALITY_MIN) stepQuality(false);       // step down promptly
  else if (fastFrames > RAISE_HOLD && quality < QUALITY_MAX) stepQuality(true);  // climb back one level at a time
}
resize();
updateCamera();
requestAnimationFrame(frame);

// deterministic hooks for frame-by-frame inspection (?debug only)
if (DEBUG) window.__ferro = {
  pause() { paused = true; },
  play() { paused = false; last = performance.now(); },
  toggle() { setOn(!S.on); return S.on; },
  set(on) { setOn(!!on); return S.on; },
  // renders a sequence of sound events offline and reports levels: { peak, rms } in dBFS
  async soundCheck(events, secs = 3) {
    const keep = { ...Au }, oc = new OfflineAudioContext(2, 48000 * secs, 48000);
    audioInit(oc);
    const live0 = Au.ctx;
    events.forEach(([at, type, a, x]) => oc.suspend(at).then(() => { SFX[type](a, x); oc.resume(); }));
    const buf = await oc.startRendering();
    Object.assign(Au, keep);
    let peak = 0, sum = 0;
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += v * v; } }
    const db = (v) => +(20 * Math.log10(Math.max(v, 1e-9))).toFixed(1);
    return { peak: db(peak), rms: db(Math.sqrt(sum / (buf.length * 2))), ctx: !!live0 };
  },
  focusRing(v) { S.focus.x = v; render(); },
  cursor(sx, sy) { S.cursor.sx = sx; S.cursor.sy = sy; S.cursor.inside = true; const g = toGround(sx, sy); S.cursor.x = g[0]; S.cursor.z = g[1]; },
  step(ms) { advance(ms / 1000); render(); return this.info(); },
  info() {
    return {
      on: S.on, t: +S.t.toFixed(3), hdr: HDR, audio: Au.ctx ? Au.ctx.state : 'none', muted: Au.muted, size: [W, H], pr: +pr.toFixed(2), quality: +quality.toFixed(2), ema: +ema.toFixed(1),
      lockedRes: LOCK_RES, adapt, bgDiscarded: +bgDiscarded.toFixed(3),
      body: +S.body.x.toFixed(3), head: +S.head.x.toFixed(3), tail: +S.tail.x.toFixed(3),
      rings: S.ring.map(r => +r.x.toFixed(3)), edge: +S.edge.x.toFixed(3), glow: +S.glowI.toFixed(3),
      button: btn.getBoundingClientRect().toJSON(),
    };
  },
};
})();
</script>
